name: Web app (GitHub Pages)

# Publishes the installable web app (used on iPhone and iPad) on every push to main.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build_pwa.py', 'android/assets/fonts/**', 'android/assets/fonts.css', 'android/icon512.png', 'android/icon-full512.png', 'android/icon-maskable512.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 scripts/build_pwa.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
