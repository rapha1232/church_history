name: Checks

# Runs on every pull request and every push to main:
#  - build: the page builds from src/ (scripts/build_site.py), deterministically; generated data is up to date
#  - smoke: the app loads in Chromium with no JavaScript errors and its core features work
#  - a11y: axe-core finds no serious or critical WCAG 2.1 AA problem on the main pages, in every theme
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/build_check.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build_site.py
      - run: node tests/smoke.js

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build_site.py
      - run: node tests/a11y.js
