name: Release APK

# Push a tag such as v18 or v18.1 (or publish a release for one) and this builds
# the Android app from site/ + android/ and attaches the APK to that release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v18)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Version from tag
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          NAME="${TAG#v}"
          MAJOR="${NAME%%.*}"; REST="${NAME#*.}"; [ "$REST" = "$NAME" ] && REST=0; MINOR="${REST%%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 100 + MINOR ))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret is not set: signing with a temporary key. This APK cannot update an app signed with the release key."
            TMP_PASS=$(openssl rand -hex 16); echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$TMP_PASS" -keypass "$TMP_PASS" -alias hcc \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Church History (temporary key)"
            echo "KEYSTORE_PASS=$TMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: KEYSTORE="$RUNNER_TEMP/release.jks" bash scripts/build_apk.sh "${{ steps.v.outputs.code }}" "${{ steps.v.outputs.name }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "Church History $TAG" \
              --notes "Android app ${{ steps.v.outputs.name }}. Download the APK below and open it on your phone to install or update (allow installs from your browser or files app if asked). iPhone and iPad: open the web app at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ in Safari and choose Share → Add to Home Screen."
          fi
